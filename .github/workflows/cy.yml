name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build common
        run: mvn -B clean install -DskipTests
        working-directory: beatflow-common

      - name: Test auth
        run: mvn -B test
        working-directory: beatflow-auth

      - name: Test catalog
        run: mvn -B test
        working-directory: beatflow-catalog

      - name: Test analytics
        run: mvn -B test
        working-directory: beatflow-analytics

      - name: Test playback
        run: mvn -B test
        working-directory: beatflow-playback

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beatflow-frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: beatflow-frontend

      - name: Build
        run: npm run build
        working-directory: beatflow-frontend
