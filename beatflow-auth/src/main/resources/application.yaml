spring:
  application:
    name: beatflow-auth

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8181

jwt:
  secret: ${JWT_SECRET:super-secret-key-super-secret-key-123456}
  access-token-expiration-ms: 900000

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
