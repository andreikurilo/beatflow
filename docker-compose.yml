services:
  postgres:
    image: postgres:16
    container_name: beatflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.50

  redis:
    image: redis:7
    container_name: beatflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: beatflow-zookeeper
    restart: unless-stopped
    profiles: [ "demo-extra" ]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:2181:2181"
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: beatflow-kafka
    restart: unless-stopped
    profiles: [ "demo-extra" ]
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.00

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: beatflow-kafka-ui
    restart: unless-stopped
    profiles: [ "demo-extra" ]
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: beatflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m"
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25

  minio:
    image: minio/minio:latest
    container_name: beatflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.50

  frontend:
    build:
      context: .
      dockerfile: ./beatflow-frontend/Dockerfile
    container_name: beatflow-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25

  auth:
    build:
      context: .
      dockerfile: ./beatflow-auth/Dockerfile
    container_name: beatflow-auth
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-super-secret-key-123456}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8181/actuator/health" ]
      interval: 40s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50

  catalog:
    build:
      context: .
      dockerfile: ./beatflow-catalog/Dockerfile
    container_name: beatflow-catalog
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-super-secret-key-123456}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:8182:8182"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8182/actuator/health" ]
      interval: 40s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50

  analytics:
    build:
      context: .
      dockerfile: ./beatflow-analytics/Dockerfile
    container_name: beatflow-analytics
    restart: unless-stopped
    profiles: [ "demo-extra" ]
    depends_on:
      - postgres
      - kafka
    environment:
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-super-secret-key-123456}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:8184:8184"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8184/actuator/health" ]
      interval: 40s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50

  playback:
    build:
      context: .
      dockerfile: ./beatflow-playback/Dockerfile
    container_name: beatflow-playback
    restart: unless-stopped
    depends_on:
      - postgres
      - catalog
      - minio
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-super-secret-key-123456}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      MINIO_BUCKET: ${MINIO_BUCKET:-beatflow-audio}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8183}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:8183:8183"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8183/actuator/health" ]
      interval: 40s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50

volumes:
  postgres_data:
  minio_data:
