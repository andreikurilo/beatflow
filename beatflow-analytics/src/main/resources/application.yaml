spring:
  application:
    name: beatflow-analytics

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

catalog:
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}

jwt:
  secret: ${JWT_SECRET:super-secret-key-super-secret-key-123456}
  access-token-expiration-ms: 900000

server:
  port: 8184
