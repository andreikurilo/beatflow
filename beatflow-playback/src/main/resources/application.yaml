spring:
  application:
    name: beatflow-playback

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:super-secret-key-super-secret-key-123456}
  access-token-expiration-ms: 900000

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8182}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:minio123}
  bucket: ${MINIO_BUCKET:beatflow-audio}

server:
  port: 8183
