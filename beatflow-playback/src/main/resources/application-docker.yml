spring:
  kafka:
    bootstrap-servers: kafka:29092

  datasource:
    url: jdbc:postgresql://postgres:5432/beatflow_playback
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

catalog:
  base-url: http://catalog:8182

minio:
  url: http://minio:9000

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8183}
  cors:
    allowedOrigins:
      - https://beatflow.akurilo.com
      - http://localhost:3000
      - http://localhost:5173
