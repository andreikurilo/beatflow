spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/beatflow_playback
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

catalog:
  base-url: http://catalog:8182

minio:
  url: http://minio:9000

app:
  public-base-url: https://beatflow.akurilo.com
  cors:
    allowedOrigins:
      - https://beatflow.akurilo.com
